name: Diagnose staged source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR source quietly
        run: |
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Inspect and extract staged files
        run: |
          python - <<'PY'
          import gzip, pathlib, tarfile
          archive = pathlib.Path('.source/integration.tar.gz')
          styles = pathlib.Path('.source/styles.css.gz')
          for path in (archive, styles):
              data = path.read_bytes()
              print(path, 'size=', len(data), 'magic=', data[:8].hex())
          with tarfile.open(archive, 'r:gz') as tar:
              print('tar members=', tar.getnames())
              tar.extractall('.')
          with gzip.open(styles, 'rb') as source:
              css = source.read()
          pathlib.Path('src/styles.css').write_bytes(css)
          print('App bytes=', pathlib.Path('src/App.tsx').stat().st_size)
          print('CSS bytes=', pathlib.Path('src/styles.css').stat().st_size)
          PY
