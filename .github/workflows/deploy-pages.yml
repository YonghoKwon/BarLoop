name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Smoke test published HTML and JavaScript
        id: smoke
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -u
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" || true)"
            script_path="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
            if printf '%s' "$html" | grep -q 'id="root"' && printf '%s' "$html" | grep -q 'BarLoop' && [ -n "$script_path" ]; then
              script_url="${PAGE_URL%/}/${script_path#./}"
              if curl --fail --silent --show-error --location --max-time 20 "$script_url" >/dev/null; then
                echo "Published page and JavaScript asset are reachable: $PAGE_URL"
                exit 0
              fi
            fi
            echo "Smoke test attempt $attempt failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Report successful smoke test
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"pages-smoke-test","description":"Published HTML and JavaScript loaded successfully"}' >/dev/null

      - name: Report failed smoke test
        if: steps.smoke.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"pages-smoke-test","description":"Published page smoke test failed"}' >/dev/null
          exit 1
