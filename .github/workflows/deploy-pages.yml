name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize staged source
        run: |
          if [ -f .source/integration.tar.gz ]; then
            tar -xzf .source/integration.tar.gz
          fi
          if [ -f .source/styles.css.gz ]; then
            gzip -dc .source/styles.css.gz > src/styles.css
          fi
      - name: Commit clean source on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -d .source ] || [ -f .github/workflows/materialize-integration.yml ]; then
            rm -rf .source
            rm -f .github/workflows/materialize-integration.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || git commit -m "Materialize drummer practice source"
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
