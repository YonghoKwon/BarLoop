name: Apply practice accuracy upgrades

on:
  push:
    branches: [agent/practice-accuracy-and-coach-upgrades]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: practice-upgrade-generation
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/practice-accuracy-and-coach-upgrades
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply application and documentation changes
        run: |
          python scripts/apply_practice_accuracy_upgrades.py
          git checkout -- .github/workflows/deploy-pages.yml
      - name: Add Playwright test dependency
        run: |
          npm install --save-dev @playwright/test
          npm pkg set scripts.test:e2e="playwright test"
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve media practice accuracy and coaching"
          git pull --rebase origin agent/practice-accuracy-and-coach-upgrades
          git push origin HEAD:agent/practice-accuracy-and-coach-upgrades
