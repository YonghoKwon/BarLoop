name: Apply subdivision count display

on:
  push:
    branches: [agent/show-subdivision-counts]
    paths:
      - .github/subdivision-counts.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/show-subdivision-counts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply_subdivision_counts.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show subdivision count positions"
          git push origin HEAD:agent/show-subdivision-counts
