name: Apply subdivision count changes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/show-subdivision-counts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/show-subdivision-counts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fix generated template escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_subdivision_counts.mjs')
          text = path.read_text()
          text = text.replace(
              "return subdivisionIndex === 0 ? token : `${beatIndex + 1} ${token}`;",
              "return subdivisionIndex === 0 ? token : `\\${beatIndex + 1} \\${token}`;",
          )
          path.write_text(text)
          PY
      - run: node scripts/apply_subdivision_counts.mjs
      - run: rm -f .github/workflows/apply-subdivision-pr.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show subdivision count positions"
          git push origin HEAD:agent/show-subdivision-counts
