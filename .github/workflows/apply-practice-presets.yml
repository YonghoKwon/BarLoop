name: Apply practice presets

on:
  push:
    branches: [agent/practice-presets-and-full-bar-guide]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-practice-presets
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/practice-presets-and-full-bar-guide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply metronome preset changes
        run: python scripts/apply_practice_presets.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MetronomeLabPage.tsx
          git commit -m "Replace rudiments with practice presets"
          git pull --rebase origin agent/practice-presets-and-full-bar-guide
          git push origin HEAD:agent/practice-presets-and-full-bar-guide
