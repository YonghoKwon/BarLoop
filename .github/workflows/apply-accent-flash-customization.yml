name: Apply accent flash customization

on:
  push:
    branches:
      - agent/accent-flash-customization
    paths:
      - .github/accent-flash-customization-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accent-flash-customization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source changes
        run: python scripts/apply_accent_flash_customization.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply_accent_flash_customization.py
          rm -f .github/workflows/apply-accent-flash-customization.yml
          rm -f .github/accent-flash-customization-trigger.txt
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Customize accent flash and clarify syncopation"
          git push origin HEAD:agent/accent-flash-customization
