name: Apply accent compatibility

on:
  push:
    branches:
      - agent/accent-flash-customization
    paths:
      - .github/accent-compat-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accent-flash-customization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_accent_compat.py
      - run: |
          rm -f scripts/fix_accent_compat.py
          rm -f .github/workflows/apply-accent-compat.yml
          rm -f .github/accent-compat-trigger.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve offbeat selector compatibility"
          git push origin HEAD:agent/accent-flash-customization
