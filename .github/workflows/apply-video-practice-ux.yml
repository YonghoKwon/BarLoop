name: Apply video practice UX patch

on:
  push:
    branches:
      - agent/video-practice-ux-training-controls
    paths:
      - scripts/apply_video_practice_ux.py
      - scripts/run_video_practice_patch.py
      - .github/workflows/apply-video-practice-ux.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_video_practice_ux.py
      - scripts/run_video_practice_patch.py
      - .github/workflows/apply-video-practice-ux.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-practice-ux-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/video-practice-ux-training-controls
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate final source
        id: generate
        run: |
          set +e
          python scripts/run_video_practice_patch.py > generation.log 2>&1
          code=$?
          cat generation.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload generation diagnostics
        if: steps.generate.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: video-practice-generation-failure
          path: generation.log
      - name: Stop after generation failure
        if: steps.generate.outputs.exit_code != '0'
        run: exit 1
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser tests
        id: browser
        run: |
          set +e
          npm run test:e2e
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload browser diagnostics
        if: steps.browser.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: video-practice-browser-failure
          if-no-files-found: warn
          path: |
            test-results
            playwright-report
      - name: Stop after browser failure
        if: steps.browser.outputs.exit_code != '0'
        run: exit 1
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e public/sw.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Improve video practice and training controls"
            git push origin HEAD:agent/video-practice-ux-training-controls
          fi
