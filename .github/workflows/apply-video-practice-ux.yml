name: Apply video practice UX patch

on:
  push:
    branches:
      - agent/video-practice-ux-training-controls
    paths:
      - scripts/apply_video_practice_ux.py
      - .github/workflows/apply-video-practice-ux.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_video_practice_ux.py
      - .github/workflows/apply-video-practice-ux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive clean source
        run: tar --exclude=.git --exclude=clean-source.tar.gz --exclude=patched-source.tar.gz -czf clean-source.tar.gz .
      - name: Apply patch and capture diagnostics
        run: |
          set +e
          python scripts/apply_video_practice_ux.py > patch-diagnostics.log 2>&1
          echo $? > patch-exit-code.txt
          cat patch-diagnostics.log
          exit 0
      - name: Archive patched source
        run: tar --exclude=.git --exclude=clean-source.tar.gz --exclude=patched-source.tar.gz -czf patched-source.tar.gz .
      - name: Upload generated source and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: video-practice-patch-workspace
          if-no-files-found: error
          path: |
            clean-source.tar.gz
            patched-source.tar.gz
            patch-diagnostics.log
            patch-exit-code.txt
