name: Apply drummer training suite

on:
  push:
    branches: [agent/drummer-training-suite]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-drummer-training-suite
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/drummer-training-suite
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply suite integration
        run: python scripts/apply_drummer_training_suite.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/standaloneMetronome.ts src/pages/MetronomeLabPage.tsx e2e/practice.spec.ts public/sw.js package-lock.json
          git commit -m "Integrate drummer training suite"
          git pull --rebase origin agent/drummer-training-suite
          git push origin HEAD:agent/drummer-training-suite
